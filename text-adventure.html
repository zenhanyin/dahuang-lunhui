<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- deploy: webp-art-v2 -->
  <title>&#22823;&#33618;&#36718;&#22238;&#24405;</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121510;
      --panel: #20251d;
      --panel-2: #2a3127;
      --ink: #f4efdf;
      --muted: #b9b39f;
      --accent: #d8b35f;
      --good: #7fc8a9;
      --bad: #d97869;
      --line: rgba(244, 239, 223, 0.15);
      --shadow: rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 10%, rgba(216, 179, 95, 0.18), transparent 28rem),
        radial-gradient(circle at 82% 86%, rgba(127, 200, 169, 0.12), transparent 30rem),
        linear-gradient(135deg, #0d100d 0%, var(--bg) 46%, #1a1b15 100%);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      line-height: 1.65;
      padding: 24px;
    }

    main {
      width: min(1060px, 100%);
      min-height: min(740px, calc(100vh - 48px));
      display: grid;
      grid-template-columns: 1fr 300px;
      border: 1px solid var(--line);
      background: rgba(32, 37, 29, 0.9);
      box-shadow: 0 24px 70px var(--shadow);
    }

    .story {
      display: flex;
      flex-direction: column;
      padding: clamp(22px, 4vw, 42px);
      border-right: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(32px, 6vw, 58px);
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1.05;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
    }

    #scene-title {
      margin: 0 0 12px;
      font-size: 24px;
      color: var(--accent);
    }

    #scene-text {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .scene-frame {
      position: relative;
      width: min(760px, 100%);
      min-height: clamp(420px, 62vh, 650px);
      margin: 20px 0 0;
      border: 1px solid var(--line);
      background: #101711;
      overflow: hidden;
      isolation: isolate;
    }

    .vn-bg,
    .vn-shade,
    .vn-portrait,
    .vn-dialogue {
      position: absolute;
    }

    .vn-bg {
      inset: 0;
      background-size: cover;
      background-position: center center;
      filter: contrast(1.04) saturate(0.98);
      transform: scale(1.02);
      transition: background-image 260ms ease, filter 260ms ease;
      z-index: 0;
    }

    .vn-shade {
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(9, 12, 9, 0.1), rgba(9, 12, 9, 0.34) 48%, rgba(9, 12, 9, 0.78)),
        radial-gradient(circle at 28% 18%, rgba(216, 179, 95, 0.13), transparent 32%),
        linear-gradient(90deg, rgba(9, 12, 9, 0.32), transparent 42%, rgba(9, 12, 9, 0.25));
      pointer-events: none;
    }

    .vn-portrait {
      right: clamp(16px, 5vw, 58px);
      bottom: 120px;
      width: clamp(150px, 23vw, 230px);
      height: clamp(240px, 42vh, 390px);
      z-index: 4;
      opacity: 0.92;
      filter: drop-shadow(0 22px 30px rgba(0, 0, 0, 0.48));
      pointer-events: none;
    }

    .vn-portrait::before,
    .vn-portrait::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .vn-portrait::before {
      top: 6%;
      width: 34%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: linear-gradient(160deg, rgba(244, 239, 223, 0.94), rgba(179, 162, 126, 0.82));
      box-shadow: 0 0 0 9px rgba(31, 30, 25, 0.72);
    }

    .vn-portrait::after {
      bottom: 0;
      width: 74%;
      height: 74%;
      border-radius: 48% 48% 10% 10%;
      background:
        radial-gradient(circle at 50% 14%, rgba(216, 179, 95, 0.28), transparent 18%),
        linear-gradient(150deg, rgba(31, 35, 31, 0.96), rgba(77, 68, 49, 0.94));
      clip-path: polygon(50% 0, 82% 16%, 100% 100%, 0 100%, 18% 16%);
    }

    .vn-portrait.is-hidden {
      display: none;
    }

    .vn-portrait.pos-left {
      left: clamp(16px, 5vw, 58px);
      right: auto;
    }

    .vn-portrait.tone-iron::after {
      background: linear-gradient(150deg, rgba(43, 50, 51, 0.98), rgba(87, 80, 62, 0.94));
    }

    .vn-portrait.tone-medicine::after {
      background: linear-gradient(150deg, rgba(35, 61, 45, 0.98), rgba(81, 91, 63, 0.94));
    }

    .vn-portrait.tone-rain::after {
      background: linear-gradient(150deg, rgba(34, 43, 55, 0.98), rgba(72, 78, 83, 0.94));
    }

    .vn-portrait.tone-star::after,
    .vn-portrait.tone-mirror::after {
      background: linear-gradient(150deg, rgba(33, 44, 63, 0.98), rgba(62, 78, 99, 0.94));
    }

    .vn-portrait.tone-shadow::after {
      background: linear-gradient(150deg, rgba(24, 25, 30, 0.98), rgba(58, 45, 55, 0.94));
    }

    .vn-portrait.tone-wood::after {
      background: linear-gradient(150deg, rgba(49, 50, 35, 0.98), rgba(91, 77, 48, 0.94));
    }

    .vn-portrait.tone-fire::after {
      background: linear-gradient(150deg, rgba(70, 38, 31, 0.98), rgba(112, 67, 38, 0.94));
    }

    .vn-portrait.tone-wanderer::after,
    .vn-portrait.tone-water::after {
      background: linear-gradient(150deg, rgba(37, 50, 48, 0.98), rgba(66, 81, 82, 0.94));
    }

    .vn-portrait.tone-sun::before {
      background: radial-gradient(circle, rgba(255, 233, 172, 0.96), rgba(215, 166, 73, 0.82));
      box-shadow: 0 0 0 9px rgba(58, 44, 21, 0.72), 0 0 38px rgba(216, 179, 95, 0.4);
    }

    .vn-portrait.tone-sun::after {
      background: linear-gradient(150deg, rgba(72, 52, 30, 0.98), rgba(125, 82, 35, 0.94));
    }

    .vn-portrait.tone-player {
      opacity: 0.72;
    }

    .vn-portrait.has-image {
      left: clamp(30px, 4vw, 50px);
      right: auto;
      bottom: clamp(34px, 4.2vw, 50px);
      width: clamp(76px, 9vw, 104px);
      height: clamp(76px, 9vw, 104px);
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      opacity: 1;
      filter: saturate(0.92) contrast(0.98);
      mix-blend-mode: normal;
      border: 1px solid rgba(244, 239, 223, 0.24);
      border-radius: 4px;
      background-color: rgba(10, 14, 11, 0.92);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.42);
      -webkit-mask-image: none;
      mask-image: none;
    }

    .vn-portrait.has-image::before {
      display: none;
    }

    .vn-portrait.has-image::after {
      content: "";
      inset: 0;
      width: auto;
      height: auto;
      left: auto;
      transform: none;
      border-radius: 4px;
      clip-path: none;
      background: linear-gradient(to bottom, rgba(244, 239, 223, 0.06), transparent 35%, rgba(9, 12, 9, 0.22));
      pointer-events: none;
    }

    .vn-portrait.has-image.pos-left {
      left: clamp(30px, 4vw, 50px);
    }

    .vn-dialogue {
      left: clamp(14px, 3vw, 28px);
      right: clamp(14px, 3vw, 28px);
      bottom: clamp(14px, 3vw, 26px);
      z-index: 3;
      min-height: 132px;
      max-height: min(260px, 38vh);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 8px;
      padding: 16px 18px 14px;
      border: 1px solid rgba(244, 239, 223, 0.2);
      background: rgba(16, 20, 15, 0.84);
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    .vn-dialogue.has-portrait {
      padding-left: clamp(124px, 15vw, 168px);
    }

    .vn-speaker {
      color: var(--accent);
      font-weight: 800;
      font-size: 14px;
    }

    .vn-text {
      min-height: 0;
      overflow: auto;
      color: var(--ink);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.72;
      white-space: pre-line;
      scrollbar-width: thin;
    }

    .vn-continue {
      justify-self: end;
      min-height: 34px;
      padding: 5px 12px;
      font-size: 14px;
      text-align: center;
      background: rgba(42, 49, 39, 0.84);
    }

    .vn-summary {
      margin: 10px 0 0;
      padding: 12px 14px;
      border: 1px solid rgba(216, 179, 95, 0.36);
      background: rgba(216, 179, 95, 0.08);
      color: var(--ink);
    }

    .choices {
      display: grid;
      gap: 12px;
      margin-top: auto;
      padding-top: 32px;
    }

    button {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--ink);
      font: inherit;
      text-align: left;
      padding: 11px 14px;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    button:hover,
    button:focus-visible {
      outline: none;
      transform: translateY(-1px);
      border-color: rgba(216, 179, 95, 0.72);
      background: #333b2f;
    }

    aside {
      padding: 28px 24px;
      background: rgba(12, 14, 11, 0.34);
    }

    .side-block + .side-block {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      color: var(--muted);
      font-weight: 700;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }

    li {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: rgba(244, 239, 223, 0.04);
      color: var(--muted);
      font-size: 14px;
    }

    li strong {
      color: var(--ink);
      text-align: right;
    }

    .meter {
      height: 11px;
      border: 1px solid var(--line);
      background: #11130f;
      overflow: hidden;
    }

    .meter span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--good), var(--accent));
      transition: width 260ms ease;
    }

    .log {
      color: var(--muted);
      font-size: 14px;
      white-space: pre-line;
    }

    .life-summary {
      margin: 18px 0 0;
      padding: 14px 16px;
      border: 1px solid rgba(216, 179, 95, 0.36);
      background: rgba(216, 179, 95, 0.08);
      color: var(--ink);
      white-space: pre-line;
    }

    .ending {
      color: var(--good);
      font-weight: 700;
    }

    .warning {
      color: var(--bad);
    }

    .audio-toggle {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
    }

    .audio-toggle strong {
      color: var(--good);
      font-weight: 700;
    }

    .language-select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--ink);
      font: inherit;
      padding: 9px 12px;
      cursor: pointer;
    }

    .language-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 800px) {
      body {
        padding: 0;
      }

      main {
        min-height: 100vh;
        grid-template-columns: 1fr;
        border: 0;
      }

      .story {
        min-height: 66vh;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .scene-frame {
        min-height: min(620px, 72vh);
      }

      .vn-portrait {
        right: 8px;
        bottom: 150px;
        width: 140px;
        height: 245px;
        opacity: 0.76;
      }

      .vn-dialogue {
        max-height: 42vh;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="story" aria-live="polite">
      <h1>大荒轮回录</h1>
      <p class="subtitle">在大荒醒来，先活过这一世</p>
      <h2 id="scene-title"></h2>
      <p id="scene-text"></p>
      <div id="scene-sketch" class="scene-frame" aria-label="当前剧情场景"></div>
      <div id="choices" class="choices"></div>
    </section>

    <aside>
      <section class="side-block">
        <h2>这一世</h2>
        <ul>
          <li><span>世数</span><strong id="life"></strong></li>
          <li><span>出生地</span><strong id="origin"></strong></li>
          <li><span>境界</span><strong id="realm"></strong></li>
          <li><span>流派</span><strong id="path"></strong></li>
          <li><span>寿元</span><strong id="years"></strong></li>
        </ul>
      </section>

      <section class="side-block">
        <h2>修为</h2>
        <div class="meter" aria-label="修为长短"><span id="qi-bar"></span></div>
        <ul>
          <li><span>灵力</span><strong id="qi"></strong></li>
          <li><span>道德</span><strong id="virtue"></strong></li>
          <li><span>因果</span><strong id="karma"></strong></li>
        </ul>
      </section>

      <section class="side-block">
        <h2>行迹</h2>
        <p id="log" class="log"></p>
      </section>

      <section class="side-block">
        <h2>声音</h2>
        <button id="audio-toggle" class="audio-toggle" type="button">
          <span>大荒主题音乐 / 音效</span>
          <strong id="audio-state">关</strong>
        </button>
      </section>

      <section class="side-block">
        <h2 data-i18n="language">语言</h2>
        <select id="language-select" class="language-select" aria-label="语言">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
        <p class="language-note" data-i18n="translationNote">翻译为内置轻量版本，中文为原始文本。</p>
      </section>
    </aside>
  </main>

    function readSavedLanguage() {
      try {

        return "";

      const text = String(value ?? "");
      if (currentLanguage === "zh" || !text) return text;
      const key = `${currentLanguage}\u0000${text}`;
      if (translationCache.has(key)) return translationCache.get(key);
      queueTranslation(currentLanguage, text, key);
      return TRANSLATION_LOADING[currentLanguage] || "Translating...";
    }

    function translateValue(value) {

    function readCachedTranslation(key) {
      try {
        return window.localStorage && window.localStorage.getItem(`dahuang-translation:${key}`);
      } catch (error) {
        return "";
      }
    }

    function writeCachedTranslation(key, value) {
      try {
        window.localStorage && window.localStorage.setItem(`dahuang-translation:${key}`, value);
      } catch (error) {}
    }

    function queueTranslation(language, text, key) {
      const cached = readCachedTranslation(key);
      if (cached) {
        translationCache.set(key, cached);
        setTimeout(render, 0);
        return;
      }
      if (translationPending.has(key)) return;
      translationPending.add(key);
      fetch("/api/translate", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ lang: language, text })
      })
        .then(response => response.ok ? response.json() : Promise.reject(new Error("bad response")))
        .then(data => {
          const translated = String(data && data.text || "").trim();
          if (!translated) throw new Error("empty translation");
          translationCache.set(key, translated);
          writeCachedTranslation(key, translated);
        })
        .catch(() => {
          translationCache.set(key, `${TRANSLATION_FAILED[language] || "Translation unavailable."}\n\n${text}`);
        })
        .finally(() => {
          translationPending.delete(key);
          if (language === currentLanguage) render();
        });
    }

        qingyangTrace: "swordTassel",
        shadowTrust: "oldToken",
        inkContract: "machineBird",
        fireOath: "trialStone",
        changqinEcho: "changqinTone",
        qiyeTrace: "blackFlag",
        foxBond: "ferryLedger",
        wandererCred: "ferryLedger",
        xuanhuiBond: "lamp",
        sunCinders: "lamp"
      };
      for (const [key, value] of Object.entries(requirements)) {
        if (key === "path") {
          if (s.path !== value) return false;
        } else if (key === "pathNot") {
          if (s.path === value) return false;
        } else if (key === "pathIn") {
          const allowed = String(value).split("|").map(item => item.trim()).filter(Boolean);
          if (!allowed.includes(s.path)) return false;
        } else if (key === "origin") {
          if (s.origin !== value) return false;
        } else if (key === "originIn") {
          const allowed = String(value).split("|").map(item => item.trim()).filter(Boolean);
          if (!allowed.includes(s.origin)) return false;
        } else if (key === "knownName") {
          if (!(s.currentNames || {})[value]) return false;
        } else if (key === "knownNameIn") {
          const allowed = String(value).split("|").map(item => item.trim()).filter(Boolean);
          if (!allowed.some(name => (s.currentNames || {})[name])) return false;
        } else if (key.endsWith("Min")) {
          const stat = key.slice(0, -3);
          if ((s[stat] || 0) < value) return false;
          if (currentRelicGates[stat] && !(s.currentRelics || {})[currentRelicGates[stat]]) return false;
        } else if (key.endsWith("Max")) {
          const stat = key.slice(0, -3);
          if ((s[stat] || 0) > value) return false;
        }
      }
      return true;
    }

    function markCurrentKnowledge(s, config = {}) {

      if (/名太子长琴|叫作太子长琴|叫他太子长琴|名为太子长琴|名字是太子长琴/.test(text)) s.currentNames.changqin = true;

    function echoFromLife(old) {
      const previous = old.echoes || {};
      const echo = { ...previous };
      const add = (key, value = 1) => {
        echo[key] = Math.min(12, (echo[key] || 0) + value);
      };
      if ((old.iceLedger || 0) > 0) add("medicine", Math.ceil(old.iceLedger / 2));
      if ((old.moFeiyunProof || 0) > 0) add("star", Math.ceil(old.moFeiyunProof / 2));
      if ((old.swordHeart || 0) > 0 || (old.qingyangTrace || 0) > 0) add("sword", Math.ceil(((old.swordHeart || 0) + (old.qingyangTrace || 0)) / 3));
      if ((old.shadowTrust || 0) > 0) add("shadow", Math.ceil(old.shadowTrust / 2));
      if ((old.inkContract || 0) > 0) add("machine", Math.ceil(old.inkContract / 2));
      if ((old.qiyeTrace || 0) > 0) add("tianji", Math.ceil(old.qiyeTrace / 2));
      if ((old.fireOath || 0) > 0) add("fire", Math.ceil(old.fireOath / 2));
      if ((old.changqinEcho || 0) > 0) add("changqin", Math.ceil(old.changqinEcho / 2));
      if ((old.foxBond || 0) > 0 || (old.wandererCred || 0) > 0) add("road", Math.ceil(((old.foxBond || 0) + (old.wandererCred || 0)) / 3));
      if ((old.xuanhuiBond || 0) > 0 || (old.sunCinders || 0) > 0) add("lamp", Math.ceil(((old.xuanhuiBond || 0) + (old.sunCinders || 0)) / 3));
      return echo;
    }

    function echoPrelude() {
      const echoes = state.echoes || {};
      const hints = [];
      if (echoes.medicine) hints.push("药炉的灰");
      if (echoes.star) hints.push("灯下的白影");
      if (echoes.sword) hints.push("雨里的剑声");
      if (echoes.tianji) hints.push("北墙外的七道刻痕");
      if (echoes.shadow) hints.push("巷口的第二道影子");
      if (echoes.machine) hints.push("翅骨里细小的响声");
      if (echoes.fire) hints.push("炉火后的热浪");
      if (echoes.changqin) hints.push("火里一声未尽的弦音");
      if (echoes.road) hints.push("渡口未点完的人数");
      if (echoes.lamp) hints.push("雪里那一点灯");
      if (!hints.length || state.memory < 3) return "";
      const visible = hints
        .map((hint, index) => ({ hint, rank: hashText(`${playerSeed}|${state.life}|echo:${hint}|${index}`) }))
        .sort((left, right) => left.rank - right.rank)
        .slice(0, Math.min(2, hints.length))
        .map(item => item.hint);
      return `\n\n你并不记得前因，只是对${visible.join("、")}有些说不清的熟悉。`;
    }

    function deepCyclePrelude(act) {
      const notes = [];
      if (state.life >= 3 && state.memory >= 6 && act >= 2) {
        notes.push("你开始分得清，哪些事是这一世亲眼所见，哪些只是上一回留下的触感又浮了上来。");
      }
      if (state.life >= 5 && state.memory >= 12 && act >= 5) {
        notes.push("有些话你上一世也听过，只是那时你还不知道，沉默本身也是一种线索。");
      }
      if (state.fragments >= 5 && state.memory >= 16 && act >= 7) {
        notes.push("铜锈不再只发热。它像在提醒你：真正反复出现的，不是铜门，而是每一次被迫站到门前的人。");
      }
      if (!notes.length) return "";
      return `\n\n${notes.slice(0, 1).join("\n\n")}`;

    function choiceEchoScore(choice) {
      const text = choice.text || "";
      const echoes = state.echoes || {};
      let score = 0;
      if (/药庐|药签|药炉|冰心/.test(text)) score += echoes.medicine || 0;
      if (/云麓|星灯|白羽|观星|海边|盐滩/.test(text)) score += echoes.star || 0;
      if (/弈剑|雨亭|剑|剑穗/.test(text)) score += echoes.sword || 0;
      if (/天机|军册|北墙|巡灯|朔方|七道刻痕|七夜|武观|上邪|军令/.test(text)) score += echoes.tianji || 0;
      if (/旧巷|夜牌|旧令|镜室|影子|太虚/.test(text)) score += echoes.shadow || 0;
      if (/机关鸟|翎羽|盐晶/.test(text)) score += echoes.machine || 0;
      if (/荒火|炭|试锋石|焦土/.test(text)) score += echoes.fire || 0;

      if (/商队|渡口|杂役|游侠|账簿/.test(text)) score += echoes.road || 0;
      if (/雪|点灯|北边|雪线/.test(text)) score += echoes.lamp || 0;
      return score;

    function scaledYearDelta(value, act) {
      if (value >= 0 || value <= -30) return value;
      const costByAct = [3, 3, 4, 5, 6, 5, 4];
      const cost = costByAct[Math.max(0, Math.min(costByAct.length - 1, act || 0))] || 4;
      return value < 0 ? value * cost : value;
    }

    function applyConfigEffects(s, config) {
      const effects = config.effects || {};
      Object.entries(effects).forEach(([key, value]) => {
        if (typeof value === "number" && (typeof s[key] === "number" || s[key] === undefined)) {
          if (s[key] === undefined) s[key] = 0;
          s[key] += key === "years" ? scaledYearDelta(value, s.actionAct ?? s.act ?? 0) : value;
        }
      });
      if (config.talentToQi) s.qi += s.talent;
      if (config.setPath) s.path = config.setPath;
      if (config.setOrigin) s.origin = config.setOrigin;
      if (config.log) s.log = config.log;
      markCurrentKnowledge(s, config);
    }

    function configChoice(config) {
      return {
        text: config.text,
        to: config.to,
        requires: config.requires ? s => requirementPass(config.requires, s) : undefined,
        effect: s => applyConfigEffects(s, config),
        advanceAct: config.advanceAct
      };
    }

      const takeRanked = (source, count, group) => source
        .map((choice, index) => ({

        }))
        .sort((left, right) => left.rank - right.rank)
        .map(item => item.choice)
        .filter(allowed)
        .slice(0, count);

      const pathCount = Math.min(2 + Math.floor(Math.max(0, state.memory) / 14), pathSource.length);
      const sharedCount = Math.min(1, Math.floor(Math.max(0, state.memory) / 12), shared.length);
      return [

        ...takeRanked(shared, sharedCount, "shared")
      ];
    }

    function chapterChoices() {
      const act = state.act || 0;
      if (state.years <= 0) {
        const debtCalls = state.karma >= 35 || state.virtue < 35;
        return [{
          text: debtCalls ? "井底有声音叫你回去" : "天快亮了，先闭眼记住此刻",
          to: debtCalls ? "hell" : "death"
        }];
      }
      const chapter = currentChapter();
      if (chapter && Array.isArray(chapter.choices)) {
        const choices = chapter.choices.map(configChoice);
        if (state.scene === "birth" && act === 0) {
          const rerollChoice = {
            text: state.rootBone ? "重新摸清这一世的身骨" : "摸清这一世的身骨",
            to: "birth",
            always: true,
            advanceAct: false,
            effect: rollBirthStats
          };
          if (!state.rootBone) return [rerollChoice];
          choices.unshift(rerollChoice);
        }
        return choices;
      }
      return [];
    }

    function cloneData(value) {
      if (typeof structuredClone === "function") return structuredClone(value);
      return JSON.parse(JSON.stringify(value));
    }

    function browserSeed() {
      try {
        const key = "dahuang-player-seed";
        let seed = window.localStorage && window.localStorage.getItem(key);
        if (!seed) {
          seed = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
          window.localStorage && window.localStorage.setItem(key, seed);
        }
        return seed;
      } catch (error) {
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }
    }

    const playerSeed = browserSeed();
    let state = cloneData(freshLife);

    function analyticsSessionId() {
      try {
        const key = "dahuang-analytics-session";
        let id = window.sessionStorage && window.sessionStorage.getItem(key);
        if (!id) {
          id = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
          window.sessionStorage && window.sessionStorage.setItem(key, id);
        }
        return id;
      } catch (error) {
        return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
      }
    }

    const analyticsSession = analyticsSessionId();

    function track(eventName, detail = {}) {
      const payload = {
        event: eventName,
        session: analyticsSession,
        player: hashText(playerSeed).toString(16),
        scene: state.scene,
        life: state.life,
        realm: realms[state.realm],
        path: state.path,
        virtue: state.virtue,
        karma: state.karma,
        fragments: state.fragments,
        turn: state.turn,
        ts: Date.now(),
        detail
      };
      const body = JSON.stringify(payload);
      try {
        if (navigator.sendBeacon) {
          const sent = navigator.sendBeacon("/api/track", new Blob([body], { type: "application/json" }));
          if (sent) return;
        }
      } catch (error) {}
      try {
        fetch("/api/track", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body,
          keepalive: true
        }).catch(() => {});
      } catch (error) {}
    }


    const sceneTitle = document.querySelector("#scene-title");

    const AudioContextClass = window.AudioContext || window.webkitAudioContext;

    if (languageSelect) {

    const audio = {
      ctx: null,
      enabled: false,
      drones: [],
      timer: null,
      master: null,
      musicStep: 0,
      currentMode: "",
      userMuted: false,

      async start() {
        if (!AudioContextClass) {
          if (audioState) audioState.textContent = ui("unsupported");
          return;
        }

        try {
          if (!this.ctx) this.ctx = new AudioContextClass();
          if (this.ctx.state === "suspended") await this.ctx.resume();
          this.enabled = true;
          this.userMuted = false;
          this.startMusic();
          this.play("start");
          this.updateLabel();
        } catch (error) {
          this.enabled = false;
          this.updateLabel();
        }
      },

      stop(manual = false) {
        this.enabled = false;
        if (manual) this.userMuted = true;
        this.stopMusic();
        this.updateLabel();
      },

      toggle() {
        if (this.enabled) this.stop(true);
        else {
          this.userMuted = false;
          this.start();
        }
      },

      ensureStarted() {
        if (!this.enabled && !this.userMuted) this.start();
      },

      updateLabel() {
        if (audioState) audioState.textContent = this.enabled ? ui("on") : ui("off");
      },

      profile() {
        const danger = state.scene === "hell" || state.scene === "falseAscend";
        const bright = state.scene === "birth" || state.scene === "trueAscend" || state.scene === "breakWheel";
        const cold = state.scene === "death" || state.scene === "sacrifice";
        const deepCycle = state.life >= 5 || state.memory >= 10 || state.fragments >= 3;
        const burdened = state.karma >= 35 || state.virtue < 35;
        const pathTint = state.path === "游侠" ? 1.125 : state.path === "天机营" ? 0.889 : 1;
        let profile = { root: 87.31, scale: [1, 1.125, 1.25, 1.5, 1.666, 2], pulse: 2800, drone: [0.5, 1, 2], color: "neutral", gain: 0.76 };
        if (danger || burdened) profile = { root: 73.42, scale: [1, 1.067, 1.25, 1.333, 1.5, 1.875], pulse: 2450, drone: [0.5, 1, 1.5], color: "dark", gain: 0.82 };
        else if (cold) profile = { root: 82.41, scale: [1, 1.125, 1.333, 1.5, 1.777, 2], pulse: 2920, drone: [0.5, 1, 2], color: "cold", gain: 0.74 };
        else if (bright) profile = { root: 98, scale: [1, 1.125, 1.25, 1.5, 1.666, 2], pulse: 2380, drone: [0.5, 1, 2], color: "bright", gain: 0.8 };
        if (deepCycle && !danger) {
          profile = {
            ...profile,
            root: profile.root * 0.944,
            pulse: Math.max(2100, profile.pulse - 220),
            drone: [0.5, 1, 1.5, 2],
            color: profile.color === "bright" ? "bright-cycle" : `${profile.color}-cycle`,
            gain: Math.min(0.88, profile.gain + 0.04)
          };
        }
        return { ...profile, root: profile.root * pathTint };
      },

      updateMusicMode() {
        if (!this.enabled || !this.ctx) return;
        const profile = this.profile();
        const mode = `${state.scene}|${state.path}|${profile.color}|${Math.min(8, state.life)}|${state.realm}|${Math.floor(state.karma / 20)}|${Math.floor(state.virtue / 20)}`;
        if (mode === this.currentMode) return;
        this.currentMode = mode;
        const now = this.ctx.currentTime;
        if (this.master) this.master.gain.setTargetAtTime(profile.gain, now, 1.2);
        this.drones.forEach(({ osc, gain }, index) => {
          const target = profile.root * profile.drone[index % profile.drone.length];
          try {
            osc.frequency.setTargetAtTime(target, now, 0.8);
            gain.gain.setTargetAtTime([0.065, 0.038, 0.022, 0.014][index] || 0.012, now, 1.4);
          } catch (error) {}
        });
      },

      startMusic() {
        if (!this.ctx || this.drones.length) return;
        const now = this.ctx.currentTime;
        const master = this.ctx.createGain();
        const profile = this.profile();
        this.master = master;
        master.gain.setValueAtTime(profile.gain, now);
        master.connect(this.ctx.destination);

        profile.drone.forEach((ratio, index) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = index === 1 ? "triangle" : "sine";
          osc.frequency.setValueAtTime(profile.root * ratio, now);
          gain.gain.setValueAtTime([0.065, 0.038, 0.022, 0.014][index] || 0.012, now);
          osc.connect(gain);
          gain.connect(master);
          osc.start();
          this.drones.push({ osc, gain, master });
        });

        this.currentMode = "";
        this.updateMusicMode();
        this.scheduleTheme();
        this.timer = window.setInterval(() => {
          if (!this.enabled || !this.ctx) return;
          this.scheduleTheme();
        }, 1850);
      },

      stopMusic() {
        if (this.timer) window.clearInterval(this.timer);
        this.timer = null;
        this.drones.forEach(({ osc, gain }) => {
          try {
            const now = this.ctx.currentTime;
            gain.gain.cancelScheduledValues(now);
            gain.gain.setTargetAtTime(0, now, 0.08);
            osc.onended = () => {
              try { osc.disconnect(); } catch (error) {}
              try { gain.disconnect(); } catch (error) {}
            };
            osc.stop(now + 0.22);
          } catch (error) {}
        });
        if (this.master) {
          const master = this.master;
          window.setTimeout(() => {
            try { master.disconnect(); } catch (error) {}
          }, 320);
        }
        this.drones = [];
        this.master = null;
        this.musicStep = 0;
        this.currentMode = "";
      },

      tone(frequency, duration = 0.16, volume = 0.06, type = "sine", startTime, destination) {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = startTime || this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(frequency, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(volume, now + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain);
          gain.connect(destination || this.ctx.destination);
          osc.onended = () => {
            try { osc.disconnect(); } catch (error) {}
            try { gain.disconnect(); } catch (error) {}
          };
          osc.start(now);
          osc.stop(now + duration + 0.03);
        } catch (error) {}
      },

      pluck(frequency, startTime, volume = 0.055) {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = startTime || this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(frequency, now);
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(900, now);
          filter.frequency.exponentialRampToValueAtTime(240, now + 1.1);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(volume, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.master || this.ctx.destination);
          osc.onended = () => {
            try { osc.disconnect(); } catch (error) {}
            try { filter.disconnect(); } catch (error) {}
            try { gain.disconnect(); } catch (error) {}
          };
          osc.start(now);
          osc.stop(now + 1.95);
        } catch (error) {}
      },

      breath(frequency, startTime, volume = 0.018) {
        this.tone(frequency, 3.2, volume, "sine", startTime, this.master || undefined);
        this.tone(frequency * 2.01, 2.4, volume * 0.16, "sine", (startTime || this.ctx.currentTime) + 0.12, this.master || undefined);
      },

      xiao(frequency, startTime, volume = 0.03) {
        if (!this.enabled || !this.ctx) return;
        const now = startTime || this.ctx.currentTime;
        this.tone(frequency, 2.9, volume, "sine", now, this.master || undefined);
        this.tone(frequency * 1.005, 2.5, volume * 0.55, "sine", now + 0.05, this.master || undefined);
      },

      drum(startTime, volume = 0.012) {
        if (!this.enabled || !this.ctx) return;
        const now = startTime || this.ctx.currentTime;
        this.tone(62, 0.18, volume, "sine", now, this.master || undefined);
      },

      scheduleTheme() {
        if (!this.enabled || !this.ctx) return;
        this.updateMusicMode();
        const profile = this.profile();
        const now = this.ctx.currentTime;
        const phrase = [0, 2, 3, 5, 3, 2, 0, 1, 2, 5, 4, 3, 2, 1, 0, 0];
        const step = this.musicStep % phrase.length;
        const ratio = profile.scale[phrase[step] % profile.scale.length];
        const base = profile.root * 2 * ratio;
        const beat = profile.pulse / 1000;
        const dark = profile.color.includes("dark");
        const cold = profile.color.includes("cold");
        const bright = profile.color.includes("bright");
        const cycle = profile.color.includes("cycle");
        this.pluck(base, now, dark ? 0.068 : 0.09);
        this.pluck(base * 1.5, now + beat * 0.34, dark ? 0.035 : 0.048);
        if (step % 2 === 0) this.breath(profile.root * 2 * profile.scale[(phrase[step] + 2) % profile.scale.length], now + 0.22, bright ? 0.038 : 0.028);
        if (step % 4 === 1) this.xiao(profile.root * 4 * profile.scale[(phrase[step] + 1) % profile.scale.length], now + beat * 0.28, cold ? 0.054 : 0.043);
        if (dark && step % 4 === 0) this.drum(now + 0.14, 0.024);
        if (cycle && step % 8 === 3) this.tone(base * 0.5, 2.2, 0.022, "sine", now + 0.18, this.master || undefined);
        if (state.virtue >= 70 && step % 8 === 6) this.tone(base * 2, 1.6, 0.028, "sine", now + 0.35, this.master || undefined);
        this.musicStep += 1;
      },

      play(kind) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const patterns = {
          click: [[220, 0], [330, 0.045]],
          start: [[220, 0], [330, 0.18], [440, 0.38]],
          break: [[330, 0], [495, 0.08], [660, 0.16]],
          rebirth: [[147, 0], [220, 0.11], [330, 0.24]],
          ending: [[392, 0], [523, 0.13], [784, 0.34]],
          danger: [[110, 0], [98, 0.12], [82, 0.24]]
        };
        (patterns[kind] || patterns.click).forEach(([frequency, offset]) => {
          this.tone(frequency, kind === "start" ? 0.32 : 0.16, kind === "danger" ? 0.035 : 0.035, "sine", now + offset);
        });
      }
    };

        || ["assets/xiling-ruins.webp"];
      const pool = (routePool || rawPool).filter(src => /^assets\/[-a-z0-9]+\.webp$/i.test(src));
      if (!pool.length) pool.push("assets/xiling-ruins.webp");
      const src = pool[seededRank(`${artKey}:${state.origin}:${state.path}`, "art") % pool.length];
      const positions = ["center center", "center top", "center 38%", "center 58%", "left center", "right center"];
      const position = positions[seededRank(state.scene, "art-position") % positions.length];
      const filter = state.scene === "hell" || state.scene === "falseAscend"
        ? "contrast(1.1) saturate(0.92) hue-rotate(-8deg)"
        : state.scene === "death" || state.scene === "sacrifice" || state.scene === "lampEnding"
          ? "contrast(1.06) saturate(0.88) hue-rotate(10deg)"
          : "contrast(1.04) saturate(0.98)";
      return { src, position, filter, alt: textOf(scene.title) };
    }

    function artworkForState(scene) {
      const art = currentArtwork(scene);
      return `<div class="art-frame"><img src="${art.src}" alt="${art.alt}" style="filter:${art.filter}; object-position:${art.position};"></div>`;
    }

    function inferSpeaker(scene) {
      return ui("narrator");
    }

    function characterEntries() {
      const configured = storyConfig.characters || {};
      return Object.entries(configured).map(([key, character]) => ({
        key,
        name: character.name || key,
        aliases: [character.name || key, ...(character.aliases || [])].filter(Boolean),
        portraitClass: character.portraitClass || key,
        position: character.position || "right",
        tone: character.tone || "neutral"
      }));
    }

    const trueNameRules = {
      "玄晖": { key: "xuanhui", publicName: "点灯人" },
      "东皇太一": { key: "xuanhui", publicName: "点灯人" },
      "武观": { key: "wuguan", publicName: "七夜" },
      "青阳": { key: "qingyang", publicName: "雨亭剑客" },
      "青阳少昊": { key: "qingyang", publicName: "雨亭剑客" },
      "莫非云": { key: "moFeiyun", publicName: "观星者" },
      "清时": { key: "qingshi", publicName: "药庐少年" },
      "遗墨": { key: "yimo", publicName: "机关师" },
      "夜哭": { key: "yeku", publicName: "递牌人" },
      "太子长琴": { key: "changqin", publicName: "火中琴声" },
      "长琴": { key: "changqin", publicName: "火中琴声" }
    };

    const portraitImages = {
      narrator: "assets/avatar-narrator.webp",
      player: "assets/avatar-player.webp",
      tianji_guard: "assets/avatar-tianji-guard.webp",
      ice_boy: "assets/avatar-ice-boy.webp",
      sword_guest: "assets/avatar-sword-guest.webp",
      star_watcher: "assets/avatar-star-watcher.webp",
      mirror_shadow: "assets/avatar-mirror-shadow.webp",
      shadow_blade: "assets/avatar-shadow-blade.webp",
      feather_mechanic: "assets/avatar-feather-mechanic.webp",
      fire_woman: "assets/avatar-fire-woman.webp",
      ferry_scholar: "assets/avatar-ferry-scholar.webp",
      old_boatman: "assets/avatar-old-boatman.webp",
      lamp_keeper: "assets/avatar-lamp-keeper.webp",
      child: "assets/avatar-child.webp",
      changqin_echo: "assets/avatar-changqin-echo.webp",
      qiye_commander: "assets/avatar-qiye-commander.webp"
    };

    function portraitSource(character, art) {
      if (!character || character.position === "hidden") return "";
      const src = portraitImages[character.key];
      if (!src) return "";
      return src;
    }

    function displayCharacter(character, spokenName) {
      const name = String(spokenName || "").trim();
      const rule = trueNameRules[name];
      if (!rule) return character;
      if ((state.currentNames || {})[rule.key]) return { ...character, name };
      return { ...character, name: rule.publicName };
    }

    function resolveCharacter(speaker) {
      const name = String(speaker || "").trim();
      const entries = characterEntries();
      const exact = entries.find(character => character.aliases.includes(name) || character.key === name);
      if (exact) return displayCharacter(exact, name);
      const fuzzy = entries.find(character => character.aliases.some(alias => alias && (name.includes(alias) || alias.includes(name))));
      if (fuzzy) return displayCharacter(fuzzy, name);
      if (!name || name === ui("narrator")) {
        return {
          key: "narrator",
          name: ui("narrator"),
          aliases: [ui("narrator")],
          portraitClass: "narrator",
          position: "hidden",
          tone: "neutral"
        };
      }
      return {
        key: "unknown",
        name,
        aliases: [name],
        portraitClass: "unknown",
        position: "hidden",
        tone: "neutral"
      };
    }

    function parseVisualParagraph(raw, fallbackSpeaker) {
      const text = String(raw || "").trim();
      const match = text.match(/^([^：:\n]{1,14})[：:]\s*([\s\S]+)$/);
      if (match && !/[，。？！、]/.test(match[1])) {
        const character = resolveCharacter(match[1].trim());
        return {
          speaker: character.name,
          character,
          text: match[2].trim()
        };
      }
      const character = resolveCharacter(fallbackSpeaker);
      return { speaker: character.name, character, text };
    }

    function splitVisualLines(scene, baseText, summary) {
      const cleaned = String(baseText || "")
        .replace(/\{\{status\}\}/g, "")
        .split(/\n{2,}/)
        .map(part => part.trim())
        .filter(Boolean);
      const entry = state.lastActionLog && state.turn > 0
        ? String(state.lastActionLog).split(/\n{2,}/).map(part => part.trim()).filter(Boolean)
        : [];
      const birthRollJustHappened = state.scene === "birth"
        && state.turn > 0
        && entry.length
        && ["rootBone", "mind", "luck", "debt"].some(key => Number(state[key] || 0) > 0);
      const baseParts = birthRollJustHappened
        ? []
        : (cleaned.length ? cleaned : [String(baseText || "").trim()].filter(Boolean));
      const parts = [...entry, ...baseParts];
      const speaker = inferSpeaker(scene);
      const lines = parts.map((text, index) => {
        const isEntryLine = index < entry.length;
        const fallbackSpeaker = isEntryLine ? ui("narrator") : speaker;
        return parseVisualParagraph(text, fallbackSpeaker);
      });
      if (summary) lines.push({ speaker: ui("narrator"), text: summary, summary: true });
      return lines.length ? lines : [{ speaker: ui("narrator"), text: "" }];
    }

    function visualSceneKey(scene) {
      return [
        state.scene,
        state.act || 0,
        state.turn || 0,
        state.life || 1,
        state.path || "",
        textOf(scene.title)
      ].join("|");
    }

    function resetVisualProgress() {
      visualState.sceneKey = "";
      visualState.lineIndex = 0;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function sceneChoiceList(scene) {
      return typeof scene.choices === "function" ? scene.choices() : (scene.choices || []);
    }

    function quietFallbackChoices(act) {
      const byAct = {
        2: [
          {
            text: "先把眼前这件事做完",
            log: "你没有急着追问远处的风声，只把眼前能做的事先做稳。"
          },
          {
            text: "记住今夜最反常的一处",
            log: "你把今夜最反常的一处记在心里。它暂时说不清来历，却足够让你下一次少走一步错路。",
            effects: { memory: 1 }
          }
        ],
        3: [
          {
            text: "把来路重新理一遍",
            log: "你把来路重新理了一遍。没弄清的地方仍旧没弄清，但哪些话不能轻信，已经比昨夜清楚。"
          },
          {
            text: "先不把手里的东西交出去",
            log: "你把手里的东西收好。有人想立刻拿走它，可你至少要先知道它为什么会落到自己手里。",
            effects: { memory: 1, karma: 1 }
          }
        ],
        4: [
          {
            text: "沿着能回头的地方走",
            log: "风雪很重，你没有把所有人都推向更深处。先找到能回头的路，也是一种前行。",
            effects: { virtue: 4, years: -1 }
          },
          {
            text: "在雪线边多停一刻",
            log: "你在雪线边多停了一刻。远处的灯没有靠近，但脚下的雪声终于变得清楚。",
            effects: { memory: 1 }
          }
        ],
        5: [
          {
            text: "先听完席间的沉默",
            log: "你没有抢先开口。沉默在席间转了一圈，许多人的眼神反而比话更诚实。",
            effects: { virtue: 3 }
          },
          {
            text: "只问自己亲眼见过的事",
            log: "你没有替任何传闻作证，只问自己亲眼见过的事。有人不满，也有人因此松了一口气。",
            effects: { memory: 1 }
          }
        ]
      };
      return (byAct[act] || []).map((item, index) => ({
        text: item.text,
        to: "afterBreak",
        always: true,
        effect: s => {
          Object.entries(item.effects || {}).forEach(([key, value]) => {
            if (typeof s[key] === "number" && typeof value === "number") {
              s[key] += key === "years" ? scaledYearDelta(value, s.actionAct ?? s.act ?? 0) : value;
            }
          });
          s.log = item.log;
          markCurrentKnowledge(s, item);
        }
      }));
    }

    function availableChoices(scene) {
      const base = sceneChoiceList(scene).filter(choice => !choice.requires || choice.requires(state));
      if (state.scene === "afterBreak" && !scene.ending && base.length > 0 && base.length < 2) {
        quietFallbackChoices(state.act || 0).forEach(choice => {
          if (!choice.once || !state.flags[choice.once]) base.push(choice);
        });
      }
      if (!base.length && !scene.ending) {
        return [{
          text: state.scene === "afterBreak" ? "先回人群里再听一夜" : "暂且退开，等风声过去",
          to: "afterBreak",
          always: true,
          effect: s => {
            s.years += scaledYearDelta(-1, s.actionAct ?? s.act ?? 0);
            s.memory += 1;
            s.virtue += 2;
            s.log = state.scene === "afterBreak"
              ? "这一夜还没有听清。你没有硬闯，只回到人群里，把漏掉的哭声再听一遍。"
              : "你暂时退开，把掌心那片铜锈重新收好。";
          }
        }];
      }
      if (state.scene !== "birth") {
        const act = state.act || 0;
        if (state.scene === "afterBreak" && act > 0 && act < 6 && base.length > 6) {
          const required = base.filter(choice => choice.always);
          const pool = base.filter(choice => !required.includes(choice));
          const visibleCount = Math.min(pool.length, 6 + Math.floor(Math.max(0, state.memory) / 8));
          const selected = pool
            .map((choice, index) => ({
              choice,
              rank: hashText(`${playerSeed}|life:${state.life}|act:${act}|path:${state.path}|choice:${choice.text}|${index}`) - choiceEchoScore(choice) * 10000000
            }))
            .sort((left, right) => left.rank - right.rank)
            .slice(0, visibleCount)
            .map(item => item.choice);
          return [...required, ...selected];
        }
        return base;
      }

      const fixed = base.filter(choice => choice.requires || choice.rebirth || choice.hardReset || choice.always);
      const origin = base.filter(choice => !fixed.includes(choice));
      const visibleOrigins = Math.min(origin.length, 3 + Math.floor(Math.max(0, state.memory) / 6));
      const seededOrigins = origin
        .map((choice, index) => ({
          choice,
          rank: hashText(`${playerSeed}|life:${state.life}|origin:${choice.text}|${index}`) - choiceEchoScore(choice) * 10000000
        }))
        .sort((left, right) => left.rank - right.rank)
        .slice(0, visibleOrigins)
        .map(item => item.choice);

      const priority = fixed.filter(choice => choice.always);
      const gated = fixed.filter(choice => !choice.always);
      return [...priority, ...seededOrigins, ...gated];
    }

function rebirth(choice) {
      audio.play(choice.hell ? "danger" : "rebirth");
      const old = cloneData(state);
      const bonus = choice.bonus || {};
      state = cloneData(freshLife);
      state.life = old.life + 1;
      state.memory = Math.max(0, old.memory + 1 + (bonus.memory || 0) - (choice.hell ? 2 : 0));
      state.talent = Math.max(0, Math.floor(old.talent * 0.55) + Math.floor(state.memory / 3) - (choice.hell ? 2 : 0));
      state.fragments = Math.max(0, old.fragments + (bonus.fragments || 0));
      state.echoes = echoFromLife(old);
      state.currentRelics = {};
      state.currentNames = {};
      state.currentPeople = {};
      state.virtue = Math.max(20, 50 + (bonus.virtue || 0) - (choice.hell ? 12 : 0));
      state.karma = choice.hell ? 15 : 0;
      state.log = choice.hell
        ? "你从冷井边醒来。时间回到开端，旧人不识你，只有几处声音比从前更刺耳。"
        : "你再度醒来。时间回到开端，旧人不认得你，昨夜的东西也不在手里，只有一些模糊的熟悉感沉进识海。";
      render();
    }

    function hardReset() {
      audio.play("rebirth");
      state = cloneData(freshLife);
      render();
    }

    function choose(choice) {
      audio.play("click");
      resetVisualProgress();
      track("choice", {
        text: choice.text,
        to: choice.to || "",
        ending: Boolean(choice.rebirth || choice.hardReset),
        currentTitle: textOf((scenes[state.scene] || scenes.birth).title)
      });
      if (choice.hardReset) {
        hardReset();
        return;
      }

      if (choice.rebirth) {
        rebirth(choice);
        return;
      }

      if (choice.once) state.flags[choice.once] = true;
      state.turn += 1;
      const actionAct = state.act || 0;
      const configuredMaxAct = Math.max(4, (storyConfig.chapters || []).length - 1);
      if (choice.advanceAct !== false) state.act = Math.min(configuredMaxAct, (state.act || 0) + 1);
      const currentScene = state.scene;
      const intendedScene = choice.to;
      state.actionAct = actionAct;
      if (choice.effect) choice.effect(state);
      delete state.actionAct;
      state.lastActionText = choice.text || "";
      state.lastActionLog = state.log || "";
      state.lastActionAct = actionAct;
      if (state.scene === currentScene) state.scene = intendedScene;
      if (state.years <= 0 && !scenes[state.scene].ending) {
        const debtCalls = state.karma >= 35 || state.virtue < 35;
        state.scene = debtCalls ? "hell" : "death";
        state.log = debtCalls
          ? "寿元走到尽头时，井底先亮了。旧债没有消失，只是换一种方式让你重走人间。"
          : "寿元走到尽头。好在你已经学会如何把失败带回下一世。";
      }

      if (scenes[state.scene].ending) {
        track("ending", {
          endingScene: state.scene,
          title: textOf(scenes[state.scene].title),
          life: state.life,
          realm: realms[state.realm],
          virtue: state.virtue,
          karma: state.karma,
          fragments: state.fragments
        });
        audio.play(state.scene === "hell" ? "danger" : "ending");
      } else if (state.scene === "afterBreak") {
        audio.play("break");
      }

      render();
    }

    function applyStaticLanguage() {
      if (document.documentElement) document.documentElement.lang = ui("htmlLang");
      document.title = ui("title");
      if (appTitle) appTitle.textContent = ui("title");
      if (subtitle) subtitle.textContent = ui("subtitle");
      if (sceneFrame && sceneFrame.setAttribute) sceneFrame.setAttribute("aria-label", ui("artLabel"));
      if (document.querySelectorAll) document.querySelectorAll("[data-i18n]").forEach(node => {
        node.textContent = ui(node.dataset.i18n);
      });
      const blocks = document.querySelectorAll ? document.querySelectorAll(".side-block") : [];
      if (blocks[0]) {
        blocks[0].querySelector("h2").textContent = ui("thisLife");
        const labels = blocks[0].querySelectorAll("li span");
        [ui("lifeCount"), ui("origin"), ui("realm"), ui("path"), ui("years")].forEach((label, index) => {
          if (labels[index]) labels[index].textContent = label;
        });
      }
      if (blocks[1]) {
        blocks[1].querySelector("h2").textContent = ui("cultivation");
        const labels = blocks[1].querySelectorAll("li span");
        [ui("qi"), ui("virtue"), ui("karma")].forEach((label, index) => {
          if (labels[index]) labels[index].textContent = label;
        });
      }
      if (blocks[2]) blocks[2].querySelector("h2").textContent = ui("trace");
      if (blocks[3]) {
        blocks[3].querySelector("h2").textContent = ui("sound");
        const audioLabel = blocks[3].querySelector(".audio-toggle span");
        if (audioLabel) audioLabel.textContent = ui("audioLabel");
      }
      audio.updateLabel();
    }

    function render() {
      applyStaticLanguage();
      const scene = scenes[state.scene] || scenes.birth;
      if (!scenes[state.scene]) {
        state.scene = "birth";
        state.log = "轮回出现裂隙，但你稳住了识海，重新回到山脚。";
      }
      const key = visualSceneKey(scene);
      if (visualState.sceneKey !== key) {
        visualState.sceneKey = key;
        visualState.lineIndex = 0;
      }
      sceneTitle.textContent = translateText(textOf(scene.title));
      sceneTitle.className = scene.ending ? "ending" : "";
      const summary = endingSummary(scene);
      const baseText = variedSceneText(scene, textOf(scene.text));
      const visualLines = splitVisualLines(scene, baseText, summary);
      visualState.lineIndex = Math.min(visualState.lineIndex, Math.max(0, visualLines.length - 1));
      const currentLine = visualLines[visualState.lineIndex] || visualLines[0];
      const allLinesSeen = visualState.lineIndex >= visualLines.length - 1;
      sceneText.textContent = translateText(currentLine.text || baseText || textOf(scene.text));
      if (sceneFrame) {
        const art = currentArtwork(scene);
        const character = currentLine.character || resolveCharacter(currentLine.speaker);
        const portraitSrc = portraitSource(character, art);
        const showPortrait = Boolean(portraitSrc) && character.position !== "hidden";
        const portraitClasses = [
          "vn-portrait",
          showPortrait ? "has-image" : "",
          `char-${character.portraitClass || character.key || "unknown"}`,
          `tone-${character.tone || "neutral"}`,
          showPortrait && character.position === "left" ? "pos-left" : "",
          showPortrait ? "" : "is-hidden"
        ].filter(Boolean).join(" ");
        const portraitStyle = portraitSrc
          ? ` style="background-image:url('${escapeHtml(portraitSrc)}');"`
          : "";
        const speakerText = translateText(currentLine.speaker || ui("narrator"));
        const lineText = translateText(currentLine.text || "");
        sceneFrame.innerHTML = `
          <img src="${escapeHtml(art.src)}" alt="${escapeHtml(art.alt)}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:${escapeHtml(art.position)};filter:${escapeHtml(art.filter)};opacity:0;pointer-events:none;">
          <div class="vn-bg" style="background-image:url('${escapeHtml(art.src)}');background-position:${escapeHtml(art.position)};filter:${escapeHtml(art.filter)};"></div>
          <div class="vn-shade"></div>
          <div class="${escapeHtml(portraitClasses)}"${portraitStyle} aria-hidden="true"></div>
          <div class="vn-dialogue${showPortrait ? " has-portrait" : ""}">
            <div class="vn-speaker">${escapeHtml(speakerText)}</div>
            <div class="vn-text${currentLine.summary ? " vn-summary" : ""}">${escapeHtml(lineText)}</div>
          </div>
        `;
      }
      audio.updateMusicMode();

      choices.innerHTML = "";
      if (!allLinesSeen) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = ui("continue");
        button.addEventListener("click", () => {
          audio.ensureStarted();
          visualState.lineIndex = Math.min(visualState.lineIndex + 1, visualLines.length - 1);
          render();
        });
        choices.appendChild(button);
      } else {
        availableChoices({ ...scene, choices: endingChoices(scene) }).forEach(choice => {
          if (choice.once && state.flags[choice.once]) return;
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = translateText(choice.text);
          button.addEventListener("click", () => {
            audio.ensureStarted();
            choose(choice);
          });
          choices.appendChild(button);
        });
      }

      life.textContent = ui("life")(state.life);
      origin.textContent = translateValue(state.origin || ui("unknown"));
      realm.textContent = translateValue(realms[state.realm]);
      path.textContent = translateValue(state.path);
      years.textContent = `${Math.max(0, state.years)} ${ui("year")}`;
      qi.textContent = state.qi;
      virtue.textContent = state.virtue;
      virtue.className = state.virtue < 35 ? "warning" : "";
      karma.textContent = state.karma;
      karma.className = state.karma > 35 ? "warning" : "";
      log.textContent = translateText(state.log);

      const nextThreshold = 28 + state.realm * 22 + Math.max(0, 50 - state.virtue) + Math.max(0, state.karma);
      qiBar.style.width = `${Math.min(100, Math.round((state.qi / Math.max(1, nextThreshold)) * 100))}%`;
    }

    render();
    track("visit", { title: document.title });
    })();
  </script>
</body>
