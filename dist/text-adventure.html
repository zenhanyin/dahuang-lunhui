<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- deploy: webp-art-v2 -->
  <title>?????</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121510;
      --panel: #20251d;
      --panel-2: #2a3127;
      --ink: #f4efdf;
      --muted: #b9b39f;
      --accent: #d8b35f;
      --good: #7fc8a9;
      --bad: #d97869;
      --line: rgba(244, 239, 223, 0.15);
      --shadow: rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 10%, rgba(216, 179, 95, 0.18), transparent 28rem),
        radial-gradient(circle at 82% 86%, rgba(127, 200, 169, 0.12), transparent 30rem),
        linear-gradient(135deg, #0d100d 0%, var(--bg) 46%, #1a1b15 100%);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      line-height: 1.65;
      padding: 24px;
    }

    main {
      width: min(1060px, 100%);
      min-height: min(740px, calc(100vh - 48px));
      display: grid;
      grid-template-columns: 1fr 300px;
      border: 1px solid var(--line);
      background: rgba(32, 37, 29, 0.9);
      box-shadow: 0 24px 70px var(--shadow);
    }

    .story {
      display: flex;
      flex-direction: column;
      padding: clamp(22px, 4vw, 42px);
      border-right: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(32px, 6vw, 58px);
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1.05;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
    }

    #scene-title {
      margin: 0 0 12px;
      font-size: 24px;
      color: var(--accent);
    }

    #scene-text {
      margin: 0;
      max-width: 72ch;
      font-size: 18px;
      white-space: pre-line;
    }

    .sketch {
      width: min(520px, 100%);
      margin: 24px 0 0;
      border: 1px solid var(--line);
      background: rgba(244, 239, 223, 0.035);
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    .sketch img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .art-frame {
      position: relative;
      width: 100%;
      height: 100%;
      background: #101711;
    }

    .art-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(16, 23, 17, 0.08), rgba(16, 23, 17, 0.18)),
        radial-gradient(circle at 24% 24%, rgba(216, 179, 95, 0.12), transparent 36%);
      pointer-events: none;
    }

    .choices {
      display: grid;
      gap: 12px;
      margin-top: auto;
      padding-top: 32px;
    }

    button {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--ink);
      font: inherit;
      text-align: left;
      padding: 11px 14px;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    button:hover,
    button:focus-visible {
      outline: none;
      transform: translateY(-1px);
      border-color: rgba(216, 179, 95, 0.72);
      background: #333b2f;
    }

    aside {
      padding: 28px 24px;
      background: rgba(12, 14, 11, 0.34);
    }

    .side-block + .side-block {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      color: var(--muted);
      font-weight: 700;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }

    li {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: rgba(244, 239, 223, 0.04);
      color: var(--muted);
      font-size: 14px;
    }

    li strong {
      color: var(--ink);
      text-align: right;
    }

    .meter {
      height: 11px;
      border: 1px solid var(--line);
      background: #11130f;
      overflow: hidden;
    }

    .meter span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--good), var(--accent));
      transition: width 260ms ease;
    }

    .log {
      color: var(--muted);
      font-size: 14px;
      white-space: pre-line;
    }

    .ending {
      color: var(--good);
      font-weight: 700;
    }

    .warning {
      color: var(--bad);
    }

    .audio-toggle {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
    }

    .audio-toggle strong {
      color: var(--good);
      font-weight: 700;
    }

    @media (max-width: 800px) {
      body {
        padding: 0;
      }

      main {
        min-height: 100vh;
        grid-template-columns: 1fr;
        border: 0;
      }

      .story {
        min-height: 66vh;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="story" aria-live="polite">
      <h1>大荒轮回录</h1>
      <p class="subtitle">在大荒诸门与幽都裂隙之间，带着记忆重走天命</p>
      <h2 id="scene-title"></h2>
      <p id="scene-text"></p>
      <div id="scene-sketch" class="sketch" aria-label="当前道途简笔画"></div>
      <div id="choices" class="choices"></div>
    </section>

    <aside>
      <section class="side-block">
        <h2>这一世</h2>
        <ul>
          <li><span>世数</span><strong id="life"></strong></li>
          <li><span>境界</span><strong id="realm"></strong></li>
          <li><span>流派</span><strong id="path"></strong></li>
          <li><span>寿元</span><strong id="years"></strong></li>
        </ul>
      </section>

      <section class="side-block">
        <h2>修为</h2>
        <div class="meter" aria-label="修为进度"><span id="qi-bar"></span></div>
        <ul>
          <li><span>灵力</span><strong id="qi"></strong></li>
          <li><span>道德</span><strong id="virtue"></strong></li>
          <li><span>因果</span><strong id="karma"></strong></li>
        </ul>
      </section>

      <section class="side-block">
        <h2>轮回记忆</h2>
        <ul>
          <li><span>记忆点</span><strong id="memory"></strong></li>
          <li><span>悟性</span><strong id="talent"></strong></li>
          <li><span>天命碎片</span><strong id="fragments"></strong></li>
        </ul>
      </section>

      <section class="side-block">
        <h2>记录</h2>
        <p id="log" class="log"></p>
      </section>

      <section class="side-block">
        <h2>声音</h2>
        <button id="audio-toggle" class="audio-toggle" type="button">
          <span>大荒主题 / 音效</span>
          <strong id="audio-state">关</strong>
        </button>
      </section>
    </aside>
  </main>

  <script>
    const realms = ["凡人", "炼气", "筑基", "金丹", "元婴", "化神", "渡劫", "飞升"];

    const freshLife = {
      scene: "birth",
      life: 1,
      realm: 0,
      qi: 0,
      years: 8,
      virtue: 50,
      karma: 0,
      memory: 0,
      talent: 0,
      fragments: 0,
      path: "未定",
      turn: 0,
      flags: {},
      log: "你在山脚小村醒来，脑海里残留着不属于孩童的旧梦。"
    };

    const scenes = {
      birth: {
        title: "山脚重生",
        text: () => `第 ${state.life} 世，你又在同一个清晨醒来。\n\n窗外青山如洗，村口老槐树下有一位白发道人摆摊算命。你记得前世许多片段：有人正道登天，有人邪法速成，也有人因道德亏损，飞升时坠入幽冥，被迫重走人间。\n\n这一次，你要怎样开局？`,
        choices: [
          {
            text: "拜入青云观，走稳健正修",
            to: "sect",
            effect: s => {
              s.path = "正修";
              s.qi += 16 + s.talent;
              s.virtue += 10;
              s.years += 2;
              s.log = "青云观传你吐纳法。慢一些，但根基清明。";
            }
          },
          {
            text: "向散修换血煞功，走偏锋邪修",
            to: "market",
            effect: s => {
              s.path = "邪修";
              s.qi += 26 + s.talent;
              s.karma += 8;
              s.virtue -= 6;
              s.log = "血煞功不必伤人也能修，只是更容易被欲念牵引。";
            }
          },
          {
            text: "用记忆点换开局悟性",
            to: "birth",
            requires: s => s.memory >= 3,
            effect: s => {
              s.memory -= 3;
              s.talent += 5;
              s.log = "你把一段轮回记忆炼成直觉。下一次吐纳，天地像慢了半拍。";
            }
          },
          {
            text: "追问白发道人：轮回是谁布下的？",
            to: "oldMan",
            requires: s => s.fragments >= 2 || s.life >= 3,
            effect: s => {
              s.log = "道人看了你很久：能问到这里，说明你已经不止活过一次。";
            }
          }
        ]
      },

      oldMan: {
        title: "老槐树下",
        text: "白发道人摊开掌心，里面不是铜钱，而是一枚裂开的天命印。\n\n他说：所谓轮回，并非天罚。三千年前仙界断路，有人把凡间做成炉，把一次次人生做成柴，想炼出一个能补天的人。\n\n你可以顺着炉火变强，也可以在足够强时打破炉壁。",
        choices: [
          {
            text: "收下天命印碎片",
            to: "birth",
            once: "oldManShard",
            effect: s => {
              s.fragments += 1;
              s.memory += 1;
              s.log = "碎片融入识海。你隐约看见飞升门后，并不全是光。";
            }
          },
          { text: "暂时离开", to: "birth" }
        ]
      },

      sect: {
        title: "青云观",
        text: "你在观中修行十年。师兄弟争夺内门名额，山下又传来妖潮将至的消息。\n\n正修讲克己守心，但不是软弱。真正的正，是强大之后仍肯护人。",
        choices: [
          {
            text: "苦修破境",
            to: "tribulation",
            effect: s => {
              s.qi += 30 + s.talent;
              s.years -= 2;
              s.log = "你闭关苦修，灵台澄澈。";
            }
          },
          {
            text: "下山护村，积累功德",
            to: "demon",
            effect: s => {
              s.virtue += 18;
              s.qi += 12 + s.talent;
              s.years -= 1;
              s.log = "你救下许多凡人，也看见修士力量该落向哪里。";
            }
          },
          {
            text: "偷看禁卷，研究邪法的边界",
            to: "forbidden",
            effect: s => {
              s.path = "兼修";
              s.qi += 20 + s.talent;
              s.karma += 4;
              s.log = "禁卷不只记载恶，也记载人心的险。你决定只取术，不取贪。";
            }
          }
        ]
      },

      market: {
        title: "黑市洞府",
        text: "邪修集市藏在雨夜山腹。这里出售速成法、替劫符、夺灵阵，也有人只把邪法当作刀，绝不砍向无辜者。\n\n力量来得越快，越需要自己握紧方向。",
        choices: [
          {
            text: "修血煞功，但只炼凶兽血气",
            to: "tribulation",
            effect: s => {
              s.qi += 34 + s.talent;
              s.karma += 6;
              s.virtue += 3;
              s.years -= 2;
              s.log = "你避开伤人捷径，进境仍快，只是心魔更早找上门。";
            }
          },
          {
            text: "买下替劫符，留给无辜者",
            to: "demon",
            effect: s => {
              s.qi += 10 + s.talent;
              s.virtue += 15;
              s.karma -= 4;
              s.years -= 1;
              s.log = "黑市商人笑你亏本。可你知道，有些账不在灵石里算。";
            }
          },
          {
            text: "贪快吞服三枚赤魂丹",
            to: "heartDemon",
            effect: s => {
              s.qi += 46 + s.talent;
              s.virtue -= 16;
              s.karma += 18;
              s.years -= 3;
              s.log = "药力汹涌如火，你听见自己的欲望在丹田里说话。";
            }
          }
        ]
      },

      forbidden: {
        title: "禁卷残页",
        text: "残页上写着一句话：正邪不在法，在用法之人。\n\n你发现所谓邪法本源是古仙补天术的残缺部分。它能吞浊气、炼怨念，若无人约束，也能吞人心。",
        choices: [
          {
            text: "立誓只炼怨浊，不夺生魂",
            to: "tribulation",
            effect: s => {
              s.qi += 25 + s.talent;
              s.virtue += 8;
              s.karma -= 2;
              s.fragments += 1;
              s.log = "誓言落下时，天命印微微发热。";
            }
          },
          {
            text: "把残页交给师门共同研究",
            to: "sectTruth",
            effect: s => {
              s.virtue += 16;
              s.qi += 14 + s.talent;
              s.log = "长老没有毁掉残页，只问你：若法可救人，何必先给它定罪？";
            }
          }
        ]
      },

      demon: {
        title: "山下妖潮",
        text: "妖潮并非天灾，而是有人抽走山脉灵脉，逼灵兽失巢。你站在村口，看见上一世害死你的魔修也在救孩子。\n\n故事从来没有简单到只分黑白。",
        choices: [
          {
            text: "救人优先，放过那名魔修",
            to: "sectTruth",
            effect: s => {
              s.virtue += 16;
              s.karma -= 5;
              s.qi += 15 + s.talent;
              s.log = "魔修临走前丢给你半枚天命印碎片。";
              s.fragments += 1;
            }
          },
          {
            text: "追查抽灵脉的幕后人",
            to: "sectTruth",
            effect: s => {
              s.qi += 24 + s.talent;
              s.years -= 2;
              s.log = "线索指向仙盟。所谓正道魁首，正在偷凡间的未来。";
              s.fragments += 1;
            }
          },
          {
            text: "借妖潮磨炼战力",
            to: "tribulation",
            effect: s => {
              s.qi += 38 + s.talent;
              s.karma += 7;
              s.virtue -= 4;
              s.years -= 2;
              s.log = "你没有害人，但你开始把灾难看成台阶。这个念头很危险。";
            }
          }
        ]
      },

      sectTruth: {
        title: "仙盟密令",
        text: "你终于查到真相：仙盟每百年挑选“可飞升者”，不是为了送他们成仙，而是送去仙界裂隙当燃料。\n\n白发道人、魔修、青云观长老，都曾是炉中薪柴。轮回让你变强，也在筛选你的心。",
        choices: [
          {
            text: "公开密令，联合正邪修士",
            to: "tribulation",
            effect: s => {
              s.virtue += 20;
              s.qi += 20 + s.talent;
              s.karma -= 8;
              s.fragments += 1;
              s.log = "越来越多人站到你身后。正邪不是阵营，选择才是。";
            }
          },
          {
            text: "独自潜入仙盟夺天梯钥",
            to: "heartDemon",
            effect: s => {
              s.qi += 42 + s.talent;
              s.karma += 10;
              s.years -= 2;
              s.log = "你赢得很快，也失去很快。孤身入局，心魔最爱这种时刻。";
            }
          }
        ]
      },

      tribulation: {
        title: "破境雷劫",
        text: () => `雷云压下，你的修为抵达瓶颈。\n\n当前灵力：${state.qi}。灵力越高，破境越稳；道德越低，天劫越重；因果越深，心魔越强。`,
        choices: [
          {
            text: "迎雷破境",
            to: "afterBreak",
            effect: s => {
              const threshold = 28 + s.realm * 22 + Math.max(0, 50 - s.virtue) + Math.max(0, s.karma);
              if (s.qi >= threshold) {
                s.realm += 1;
                s.qi = Math.max(0, s.qi - threshold + 8);
                s.years += 5;
                s.memory += 1;
                s.log = `你扛过雷劫，踏入${realms[s.realm]}。这次经验化作 1 点轮回记忆。`;
              } else {
                s.scene = "death";
                s.log = "雷光落下，你知道还差一点。下一世，你会记住这一道雷。";
              }
            }
          },
          {
            text: "沉心补德，先化解因果",
            to: "afterBreak",
            effect: s => {
              s.virtue += 12;
              s.karma = Math.max(0, s.karma - 10);
              s.qi += 6 + s.talent;
              s.years -= 1;
              s.log = "你没有急着变强。很多时候，慢一步才走得更远。";
            }
          },
          {
            text: "以邪法吞雷，强行提速",
            to: "heartDemon",
            effect: s => {
              s.qi += 38 + s.talent;
              s.karma += 14;
              s.virtue -= 10;
              s.log = "雷霆被你炼入血脉。力量是真的，代价也是真的。";
            }
          }
        ]
      },

      afterBreak: {
        title: "道途抉择",
        text: () => `你如今是${realms[state.realm]}修士。轮回记忆越积越厚，前世失败正在变成今生的台阶。\n\n若继续修行，你可能飞升、坠入幽冥，或者揭开天命炉的终局。`,
        choices: [
          {
            text: "继续这一世",
            to: "sect",
            requires: s => s.realm < 5 && s.years > 0,
            effect: s => {
              s.years -= 1;
              s.log = "你收拾行囊，再入尘世。";
            }
          },
          {
            text: "尝试飞升",
            to: "ascend",
            requires: s => s.realm >= 5
          },
          {
            text: "直面天命炉，打破轮回",
            to: "breakWheel",
            requires: s => s.fragments >= 4 && s.realm >= 4
          },
          {
            text: "寿元耗尽，坦然入轮回",
            to: "death",
            requires: s => s.years <= 0
          }
        ]
      },

      heartDemon: {
        title: "心魔问道",
        text: "心魔不是另一个你，而是你每次想走捷径时留下的影子。\n\n它问：既然轮回能重来，为什么还要珍惜这一世的人？",
        choices: [
          {
            text: "承认贪念，但不让它掌舵",
            to: "tribulation",
            effect: s => {
              s.virtue += 10;
              s.karma = Math.max(0, s.karma - 8);
              s.memory += 1;
              s.log = "你没有否认黑暗，只是把灯重新点亮。";
            }
          },
          {
            text: "以意志镇压心魔",
            to: "afterBreak",
            effect: s => {
              s.qi += 20 + s.talent;
              s.karma += 5;
              s.log = "你暂时赢了，但镇压不是化解。";
            }
          },
          {
            text: "任由心魔接管",
            to: "hell",
            effect: s => {
              s.virtue -= 30;
              s.karma += 30;
              s.log = "你得到了力量，也把自己从人间的牵挂里拔了出来。";
            }
          }
        ]
      },

      ascend: {
        title: "飞升门前",
        text: () => `天门打开，金光照落。可门后传来锁链声。\n\n你的道德为 ${state.virtue}，因果为 ${state.karma}。道德越低，飞升越像审判；因果越深，越容易被打入幽冥重走人间。`,
        choices: [
          {
            text: "踏入天门",
            to: "ascendResult",

    const audio = {
      ctx: null,
      enabled: false,
      drones: [],
      timer: null,
      master: null,
      musicStep: 0,
      currentMode: "",

      async start() {
        if (!AudioContextClass) {
          if (audioState) audioState.textContent = "不支持";
          return;
        }

        try {
          if (!this.ctx) this.ctx = new AudioContextClass();
          if (this.ctx.state === "suspended") await this.ctx.resume();
          this.enabled = true;
          this.startMusic();
          this.play("start");
          this.updateLabel();
        } catch (error) {
          this.enabled = false;
          this.updateLabel();
        }
      },

      stop() {
        this.enabled = false;
        this.stopMusic();
        this.updateLabel();
      },

      toggle() {
        if (this.enabled) this.stop();
        else this.start();
      },

      updateLabel() {
        if (audioState) audioState.textContent = this.enabled ? "开" : "关";
      },

      profile() {
        const danger = state.scene === "hell" || state.scene === "heartDemon" || state.scene === "copperGate";
        const bright = state.scene === "birth" || state.scene === "sect" || state.scene === "foxRoad" || state.scene === "greatCouncil" || state.scene === "trueEnding";
        const cold = state.scene === "northSea" || state.scene === "shadow";
        if (danger) return { root: 82.41, scale: [1, 1.125, 1.2, 1.5, 1.6, 1.875, 2], pulse: 980, drone: [0.72, 1, 1.2], color: "dark" };
        if (cold) return { root: 98, scale: [1, 1.125, 1.333, 1.5, 1.777, 2], pulse: 1420, drone: [1, 1.5, 2], color: "cold" };
        if (bright) return { root: 110, scale: [1, 1.125, 1.25, 1.5, 1.666, 2], pulse: 1180, drone: [1, 1.5, 2], color: "bright" };
        return { root: 103.83, scale: [1, 1.125, 1.25, 1.5, 1.666, 1.875, 2], pulse: 1280, drone: [1, 1.5, 2], color: "neutral" };
      },

      updateMusicMode() {
        if (!this.enabled || !this.ctx) return;
        const profile = this.profile();
        const mode = `${state.scene}|${state.path}|${profile.color}`;
        if (mode === this.currentMode) return;
        this.currentMode = mode;
        const now = this.ctx.currentTime;
        this.drones.forEach(({ osc, gain }, index) => {
          const target = profile.root * profile.drone[index % profile.drone.length];
          try {
            osc.frequency.setTargetAtTime(target, now, 0.8);
            gain.gain.setTargetAtTime(index === 0 ? 0.62 : 0.24, now, 0.8);
          } catch (error) {}
        });
      },

      startMusic() {
        if (!this.ctx || this.drones.length) return;
        const now = this.ctx.currentTime;
        const master = this.ctx.createGain();
        const profile = this.profile();
        this.master = master;
        master.gain.setValueAtTime(0.16, now);
        master.connect(this.ctx.destination);

        profile.drone.forEach((ratio, index) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = index === 1 ? "triangle" : "sine";
          osc.frequency.setValueAtTime(profile.root * ratio, now);
          gain.gain.setValueAtTime(index === 0 ? 0.62 : 0.24, now);
          osc.connect(gain);
          gain.connect(master);
          osc.start();
          this.drones.push({ osc, gain, master });
        });

        this.currentMode = "";
        this.updateMusicMode();
        this.scheduleTheme();
        window.setTimeout(() => this.scheduleTheme(), 260);
        window.setTimeout(() => this.scheduleTheme(), 560);
        this.timer = window.setInterval(() => {
          if (!this.enabled || !this.ctx) return;
          this.scheduleTheme();
        }, 980);
      },

      stopMusic() {
        if (this.timer) window.clearInterval(this.timer);
        this.timer = null;
        this.drones.forEach(({ osc, gain }) => {
          try {
            const now = this.ctx.currentTime;
            gain.gain.cancelScheduledValues(now);
            gain.gain.setTargetAtTime(0, now, 0.08);
            osc.stop(now + 0.22);
          } catch (error) {}
        });
        this.drones = [];
        this.master = null;
        this.musicStep = 0;
        this.currentMode = "";
      },

      tone(frequency, duration = 0.16, volume = 0.06, type = "sine", startTime, destination) {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = startTime || this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(frequency, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(volume, now + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain);
          gain.connect(destination || this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.03);
        } catch (error) {}
      },

      pluck(frequency, startTime, volume = 0.04) {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = startTime || this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(frequency, now);
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(1800, now);
          filter.frequency.exponentialRampToValueAtTime(420, now + 0.42);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(volume, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.master || this.ctx.destination);
          osc.start(now);
          osc.stop(now + 1);
        } catch (error) {}
      },

      breath(frequency, startTime, volume = 0.018) {
        this.tone(frequency, 1.6, volume, "sine", startTime, this.master || undefined);
        this.tone(frequency * 2.01, 1.2, volume * 0.28, "sine", (startTime || this.ctx.currentTime) + 0.04, this.master || undefined);
      },

      drum(startTime, volume = 0.05) {
        if (!this.enabled || !this.ctx) return;
        const now = startTime || this.ctx.currentTime;
        this.tone(62, 0.14, volume, "sine", now, this.master || undefined);
        this.tone(42, 0.22, volume * 0.55, "triangle", now + 0.02, this.master || undefined);
      },

      scheduleTheme() {
        if (!this.enabled || !this.ctx) return;
        this.updateMusicMode();
        const profile = this.profile();
        const now = this.ctx.currentTime;
        const phrase = [0, 2, 4, 3, 2, 5, 4, 1, 0, 2, 3, 5, 4, 2, 1, 0];
        const step = this.musicStep % phrase.length;
        const ratio = profile.scale[phrase[step] % profile.scale.length];
        const base = profile.root * 2 * ratio;
        const beat = profile.pulse / 1000;
        this.pluck(base, now, profile.color === "dark" ? 0.032 : 0.044);

        ascendResult: ["assets/tribulation.webp"]
      };
      const pool = imagePools[state.scene] || ["assets/xiling-ruins.webp"];
      const src = pool[seededRank(state.scene, "art") % pool.length];
      const positions = ["center center", "center top", "center 38%", "center 58%", "left center", "right center"];
      const position = positions[seededRank(state.scene, "art-position") % positions.length];
      const filter = state.scene === "hell" || state.scene === "heartDemon"
        ? "contrast(1.1) saturate(0.92) hue-rotate(-8deg)"
        : state.scene === "northSea" || state.scene === "death"
          ? "contrast(1.06) saturate(0.88) hue-rotate(10deg)"
          : "contrast(1.04) saturate(0.98)";
      return `<div class="art-frame"><img src="${src}" alt="${scene.title}" style="filter:${filter}; object-position:${position};"></div>`;
    }

    function availableChoices(scene) {
      const base = (scene.choices || []).filter(choice => !choice.requires || choice.requires(state));
      if (state.scene !== "birth") return base;

      const fixed = base.filter(choice => choice.requires || choice.rebirth || choice.hardReset || choice.always);
      const origin = base.filter(choice => !fixed.includes(choice));
      const visibleOrigins = Math.min(origin.length, 3 + Math.floor(Math.max(0, state.memory) / 6));
      const seededOrigins = origin
        .map((choice, index) => ({
          choice,
          rank: hashText(`${playerSeed}|life:${state.life}|origin:${choice.text}|${index}`)
        }))
        .sort((left, right) => left.rank - right.rank)
        .slice(0, visibleOrigins)
        .map(item => item.choice);

      return [...seededOrigins, ...fixed];
    }

    function rebirth(choice) {
      audio.play(choice.hell ? "danger" : "rebirth");
      const old = cloneData(state);
      const bonus = choice.bonus || {};
      state = cloneData(freshLife);
      state.life = old.life + 1;
      state.memory = Math.max(0, old.memory + 1 + (bonus.memory || 0) - (choice.hell ? 2 : 0));
      state.talent = Math.max(0, Math.floor(old.talent * 0.55) + Math.floor(state.memory / 3) - (choice.hell ? 2 : 0));
      state.fragments = Math.max(0, old.fragments + (bonus.fragments || 0));
      state.virtue = Math.max(20, 50 + (bonus.virtue || 0) - (choice.hell ? 12 : 0));
      state.karma = choice.hell ? 15 : 0;
      state.log = choice.hell
        ? "你从幽冥归来，开局更难，但记忆更锋利。"
        : "你再度醒来。前世的痛苦没有白费，它们沉成了悟性。";
      render();
    }

    function hardReset() {
      audio.play("rebirth");
      state = cloneData(freshLife);
      render();
    }

    function choose(choice) {
      audio.play("click");
      if (choice.hardReset) {
        hardReset();
        return;
      }

      if (choice.rebirth) {
        rebirth(choice);
        return;
      }

      if (choice.once) state.flags[choice.once] = true;
      state.turn += 1;
      const currentScene = state.scene;
      const intendedScene = choice.to;
      if (choice.effect) choice.effect(state);
      if (state.scene === currentScene) state.scene = intendedScene;

      if (state.years <= 0 && !scenes[state.scene].ending) {
        state.scene = "death";
        state.log = "寿元走到尽头。好在你已经学会如何把失败带回下一世。";
      }

      if (scenes[state.scene].ending) {
        audio.play(state.scene === "hell" ? "danger" : "ending");
      } else if (state.scene === "afterBreak") {
        audio.play("break");
      } else if (state.scene === "heartDemon") {
        audio.play("danger");
      }

      render();
    }

    function render() {
      const scene = scenes[state.scene] || scenes.birth;
      if (!scenes[state.scene]) {
        state.scene = "birth";
        state.log = "轮回出现裂隙，但你稳住了识海，重新回到山脚。";
      }
      sceneTitle.textContent = scene.title;
      sceneTitle.className = scene.ending ? "ending" : "";
      sceneText.textContent = variedSceneText(scene, textOf(scene.text));
      if (sceneSketch) sceneSketch.innerHTML = artworkForState(scene);
      audio.updateMusicMode();

      choices.innerHTML = "";
      availableChoices(scene).forEach(choice => {
        if (choice.once && state.flags[choice.once]) return;
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = choice.text;
        button.addEventListener("click", () => choose(choice));
        choices.appendChild(button);
      });

      life.textContent = `第 ${state.life} 世`;
      realm.textContent = realms[state.realm];
      path.textContent = state.path;
      years.textContent = `${Math.max(0, state.years)} 年`;
      qi.textContent = state.qi;
      virtue.textContent = state.virtue;
      virtue.className = state.virtue < 35 ? "warning" : "";
      karma.textContent = state.karma;
      karma.className = state.karma > 35 ? "warning" : "";
      memory.textContent = state.memory;
      talent.textContent = state.talent;
      fragments.textContent = state.fragments;
      log.textContent = state.log;

      const nextThreshold = 28 + state.realm * 22 + Math.max(0, 50 - state.virtue) + Math.max(0, state.karma);
      qiBar.style.width = `${Math.min(100, Math.round((state.qi / Math.max(1, nextThreshold)) * 100))}%`;
    }

    render();
  </script>
</body>
</html>
